###------------ Trade Template properties
trade.template.vd-forward-days=50
trade.template.vd-backward-days=25
trade.template.cfs-for-backvd-cf=50
trade.template.max-amendments=10
###------------ Trade Generator properties
trade.generator.frequency-seconds-default=120
trade.generator.frequency-seconds.-FX=15
trade.generator.frequency-seconds.-MM_TERM=30
trade.generator.frequency-seconds.-MM_CALL=60
trade.generator.frequency-seconds.-PAYMENT=180
trade.generator.frequency-seconds.-BOND=60
trade.generator.frequency-seconds.INTER_BOOK-=420
trade.generator.frequency-seconds.INTER_BRANCH-=320
trade.generator.frequency-seconds.INTER_COMPANY-=280
trade.generator.frequency-seconds.CORPORATE_ACTION-=500
